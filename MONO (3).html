<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101010">
<title>MONO</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#101010;--bg2:#1D1B17;--gold:#D6B45C;--gold2:#B99A50;--tx:#F5F1E7;--mu:#A8A196;--bd:#44391F;--on:#101010;--ok:#8fbf8f;--bad:#d98a7a;
--serif:"Cormorant Garamond",Georgia,serif;--sans:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=light]{--bg:#F5F1E7;--bg2:#FFFDF8;--gold:#8A6D1F;--gold2:#6f5817;--tx:#1b1810;--mu:#6a6455;--bd:#DDD2B5;--on:#FFFDF8;--ok:#3f7a4a;--bad:#b0452f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:400 15px/1.55 var(--sans);min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
nav{background:var(--bg2);border-right:1px solid var(--bd);padding:28px 18px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.logo{font:600 34px var(--serif);letter-spacing:.14em;color:var(--gold);margin:0 8px 2px}
.tag{color:var(--mu);font-size:13px;margin:0 8px 26px}
nav button{background:none;border:1px solid transparent;border-radius:12px;padding:11px 14px;text-align:left;color:var(--mu);transition:.2s}
nav button:hover{color:var(--tx);background:rgba(214,180,92,.07)}
nav button.on{color:var(--gold);border-color:var(--bd);background:rgba(214,180,92,.1)}
main{padding:36px clamp(18px,4vw,48px);max-width:1000px;width:100%}
h1{font:600 clamp(32px,5vw,46px)/1.1 var(--serif);margin:0 0 4px}
h2{font:600 24px var(--serif);margin:0 0 12px}
.mu{color:var(--mu)}
.card{background:var(--bg2);border:1px solid var(--bd);border-radius:18px;padding:20px}
.grid{display:grid;gap:16px}
.hero{grid-template-columns:230px 1fr;align-items:center;margin:26px 0 16px}
.stats{grid-template-columns:repeat(3,1fr)}
.stat b{display:block;font:600 38px/1 var(--serif);color:var(--gold)}
.two{grid-template-columns:1fr 1fr}
.ring{position:relative;width:170px;height:170px;margin:auto}
.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9}
.ring .fg{stroke:var(--gold);stroke-linecap:round;transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)}
.ring .bg{stroke:var(--bd)}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font:600 46px var(--serif)}
.btn{background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--on);border:0;border-radius:12px;padding:10px 18px;font-weight:600;transition:.2s}
.btn:hover{transform:translateY(-1px);filter:brightness(1.08)}
.ghost{background:none;border:1px solid var(--bd);color:var(--tx);border-radius:12px;padding:9px 16px;transition:.2s}
.ghost:hover{border-color:var(--gold);color:var(--gold)}
.danger:hover{border-color:var(--bad);color:var(--bad)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{justify-content:space-between}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.chip{background:none;border:1px solid var(--bd);border-radius:99px;padding:6px 14px;color:var(--mu)}
.chip.on{background:var(--gold);color:var(--on);border-color:var(--gold)}
.list{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.item{display:flex;gap:12px;align-items:flex-start;background:var(--bg2);border:1px solid var(--bd);border-radius:14px;padding:14px;transition:.2s}
.item:hover{border-color:var(--gold2)}
.item.done .t{text-decoration:line-through;color:var(--mu)}
.chk{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--gold2);background:none;display:grid;place-items:center;color:var(--on);font-size:13px;margin-top:1px}
.done .chk{background:var(--gold)}
.grow{flex:1;min-width:0}
.t{font-weight:600;overflow-wrap:anywhere}
.meta{font-size:13px;color:var(--mu);display:flex;gap:10px;flex-wrap:wrap;margin-top:2px}
.pri{padding:0 8px;border-radius:99px;border:1px solid var(--bd)}
.pri.High{color:var(--bad);border-color:var(--bad)}.pri.Medium{color:var(--gold)}
.late{color:var(--bad)}
.lnk{background:none;border:0;color:var(--mu);padding:2px 6px;border-radius:8px}
.lnk:hover{color:var(--gold)}
.tl{border-left:2px solid var(--bd);margin-left:60px;padding-left:18px;display:grid;gap:12px;position:relative}
.tl .item{position:relative}
.tl .tm{position:absolute;left:-90px;width:60px;text-align:right;font-size:13px;color:var(--gold);top:14px}
.seg{display:inline-flex;border:1px solid var(--bd);border-radius:12px;overflow:hidden;margin-top:16px}
.seg button{background:none;border:0;padding:8px 18px;color:var(--mu)}
.seg button.on{background:rgba(214,180,92,.15);color:var(--gold)}
.empty{text-align:center;color:var(--mu);padding:30px 16px;border:1px dashed var(--bd);border-radius:14px}
.skel{height:56px;border-radius:14px;background:linear-gradient(90deg,var(--bg2),var(--bd),var(--bg2));background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
dialog{background:var(--bg2);color:var(--tx);border:1px solid var(--bd);border-radius:20px;padding:24px;width:min(460px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.65)}
label{display:grid;gap:4px;font-size:13px;color:var(--mu);margin-bottom:12px}
input,select,textarea{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;width:100%;color:var(--tx)}
input:focus,select:focus,textarea:focus{border-color:var(--gold);outline:none}
.two-f{display:grid;grid-template-columns:1fr 1fr;gap:12px}
#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--gold);color:var(--on);padding:10px 18px;border-radius:12px;font-weight:600;opacity:0;pointer-events:none;transition:.3s;z-index:9}
#toast.show{opacity:1;transform:translate(-50%,0)}
.view{animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:760px){
.app{grid-template-columns:1fr}
nav{position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;flex-direction:row;justify-content:space-around;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid var(--bd);z-index:5}
nav .logo,nav .tag{display:none}nav button{text-align:center;flex:1}
main{padding:24px 16px 110px}
.hero,.two{grid-template-columns:1fr}.stats{gap:10px}.stat b{font-size:30px}.card{padding:16px}
.tl{margin-left:48px}.tl .tm{left:-76px;width:50px}
}
html,body{overflow-x:hidden;max-width:100%}
.chk{position:relative}.chk::after{content:"";position:absolute;inset:-10px}
@media(pointer:coarse){.btn,.ghost,.chip,.seg button,nav button{min-height:44px}.lnk{min-height:44px;min-width:44px}input,select,textarea{font-size:16px;min-height:44px}}
@media(max-height:480px) and (orientation:landscape){main{padding-bottom:84px}h1{font-size:28px}}
@media(display-mode:standalone){body{-webkit-user-select:none;user-select:none}input,textarea{-webkit-user-select:text;user-select:text}}
input[type=checkbox]{width:20px;height:20px;min-height:20px;padding:0;accent-color:var(--gold)}input[type=range]{padding:0;min-height:0;accent-color:var(--gold)}
.tm{font:600 clamp(72px,18vw,150px)/1 var(--serif);color:var(--gold);letter-spacing:.02em;margin:10px 0}
.fbox{text-align:center;padding:36px 16px}.fbox.run{animation:glow 3s ease-in-out infinite}@keyframes glow{50%{box-shadow:0 0 40px rgba(214,180,92,.2)}}
.fsm .fbox{position:fixed;inset:0;z-index:20;border-radius:0;border:0;display:flex;flex-direction:column;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
.bar{height:8px;border-radius:99px;background:var(--bd);overflow:hidden;margin:10px 0}.bar>div{height:100%;background:linear-gradient(90deg,var(--gold2),var(--gold));border-radius:99px;transition:width .6s}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 0}.goal{list-style:none}
.wk{display:flex;gap:4px;margin-top:8px}.wk i,.heat i{width:12px;height:12px;border-radius:4px;background:var(--bd);opacity:.4;display:block}
.wk i.y,.heat i.y{background:var(--gold);opacity:1}.wk i.m,.heat i.m{background:none;border:1px solid var(--gold2);opacity:.9}
.heat{display:grid;grid-template-columns:repeat(7,18px);gap:4px;margin-top:10px}.heat i{width:18px;height:18px}.heat span{font-size:10px;color:var(--mu);text-align:center}
.chk:disabled{opacity:.35;cursor:default}
@media(max-width:760px){nav button{padding:10px 2px;font-size:12px}}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cd{aspect-ratio:1;border:1px solid var(--bd);border-radius:12px;background:none;position:relative;min-height:40px}
.cd.td{border-color:var(--gold);color:var(--gold)}.cd.on{background:rgba(214,180,92,.2)}.cd b{position:absolute;bottom:6px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--gold)}
.jb{white-space:pre-wrap;font:400 17px/1.7 var(--serif);margin-top:10px;overflow-wrap:anywhere}.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.cmd{display:block;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:12px;color:var(--tx)}.cmd.on,.cmd:hover{background:rgba(214,180,92,.14);color:var(--gold)}
nav .mo{display:none}@media(max-width:760px){nav .mx{display:none}nav .mo{display:block}}
</style>
</head>
<body>
<div class="app">
<nav aria-label="Main">
<div class="logo">MONO</div><p class="tag">Focus. Organise. Execute.</p>
<button data-go="dash">Overview</button><button data-go="tasks">Tasks</button><button data-go="focus">Focus</button><button data-go="habits">Habits</button><button class="mx" data-go="calendar">Calendar</button><button class="mx" data-go="goals">Goals</button><button class="mx" data-go="journal">Journal</button><button class="mx" data-go="stats">Statistics</button><button class="mx" data-go="set">Settings</button><button class="mo" data-more>More</button><button class="mx" data-cmd style="margin-top:auto">Search commands</button>
</nav>
<main id="main" aria-live="polite"></main>
</div>

<dialog id="dTask"><form id="fTask"><h2 id="dTaskH">New task</h2>
<label>Title<input name="title" required maxlength="120"></label>
<label>Description (optional)<textarea name="desc" rows="2" maxlength="400"></textarea></label>
<div class="two-f"><label>Priority<select name="pri"><option>Low</option><option selected>Medium</option><option>High</option></select></label>
<label>Deadline<input type="date" name="due"></label></div>
<div class="two-f"><label>Deadline time<input type="time" name="dueT"></label><label>Reminder<select name="remk"><option value="off">No reminder</option><option value="5">5 minutes before</option><option value="10">10 minutes before</option><option value="15">15 minutes before</option><option value="30">30 minutes before</option><option value="60">1 hour before</option><option value="custom">Custom time before</option><option value="exact">Exact date and time</option></select></label></div>
<div id="rc" hidden><label>Minutes before the deadline<input type="number" name="remc" min="1" max="10080" value="20"></label></div>
<div id="rx" hidden><label>Remind me at<input type="datetime-local" name="rema"></label></div>
<div id="rl" hidden><label style="display:flex;gap:10px;align-items:center"><input type="checkbox" name="reml"> Also remind me at the deadline</label></div>
<label>Category<input name="cat" list="cats" maxlength="30" placeholder="Choose or type a new one"></label><datalist id="cats"></datalist>
<div class="row sp"><button type="button" class="ghost" data-close>Cancel</button><button class="btn">Save task</button></div></form></dialog>

<dialog id="dAct"><form id="fAct"><h2 id="dActH">New activity</h2>
<label>Title<input name="title" required maxlength="100"></label>
<label>Date<input type="date" name="date" required></label>
<div class="two-f"><label>Starts<input type="time" name="start" required></label><label>Ends<input type="time" name="end" required></label></div>
<div class="row sp"><button type="button" class="ghost" data-close>Cancel</button><button class="btn">Save activity</button></div></form></dialog>

<dialog id="dConf"><h2 id="cH">Are you sure?</h2><p id="cP" class="mu"></p>
<div class="row sp"><button class="ghost" id="cNo">Keep it</button><button class="btn" id="cYes">Confirm</button></div></dialog>
<dialog id="dEv"><form id="fEv"><h2 id="dEvH">New event</h2>
<label>Title<input name="title" required maxlength="100"></label>
<label>Date<input type="date" name="date" required></label>
<div class="two-f"><label>Starts<input type="time" name="start" required></label><label>Ends<input type="time" name="end" required></label></div>
<label>Category<input name="cat" list="cats" maxlength="30"></label>
<label>Description (optional)<textarea name="desc" rows="2" maxlength="400"></textarea></label>
<label>Reminder<select name="rmk"><option value="">No reminder</option><option value="0">At start time</option><option value="5">5 minutes before</option><option value="10">10 minutes before</option><option value="15">15 minutes before</option><option value="30">30 minutes before</option><option value="60">1 hour before</option><option value="custom">Custom minutes before</option></select></label>
<div id="evc" hidden><label>Minutes before<input type="number" name="rmc" min="0" max="10080" value="20"></label></div>
<div class="row sp"><button type="button" class="ghost" data-close>Cancel</button><button class="btn">Save event</button></div></form></dialog>
<dialog id="dJ"><form id="fJ"><h2 id="dJH">New entry</h2>
<label>Title<input name="title" maxlength="120"></label>
<label>Date<input type="date" name="date" required></label>
<label>Reflection<textarea name="body" rows="10" maxlength="20000" style="font:17px/1.7 var(--serif)"></textarea></label>
<div class="row" style="margin-bottom:12px"><button type="button" class="ghost" data-jprompt>Add reflection prompts</button></div>
<label>Tags (comma separated)<input name="tags" maxlength="120"></label>
<div class="row sp"><button type="button" class="ghost" data-close>Cancel</button><button class="btn">Save entry</button></div></form></dialog>
<dialog id="dBk"><h2 id="bkH">Export</h2><textarea id="bk" rows="9" aria-label="Backup data" placeholder="Paste a MONO backup here to restore it" style="font:12px monospace"></textarea>
<p class="mu" style="font-size:13px">Downloads can be blocked in some views. If nothing downloads, copy the text instead.</p>
<div class="row"><button class="btn" data-bkdl>Download</button><button class="ghost" data-bkcp>Copy</button></div>
<div id="bkR" class="row" style="margin-top:12px"><button class="ghost" data-bkrest>Restore from text</button><label class="ghost" style="margin:0;color:var(--tx)">Choose file<input type="file" id="bkf" accept=".json,application/json" hidden></label></div>
<div class="row" style="margin-top:12px"><button class="ghost" data-close>Close</button></div></dialog>
<dialog id="dCmd" style="padding:12px"><input id="cq" placeholder="Type a command" aria-label="Search commands" autocomplete="off"><div id="cl" style="margin-top:8px;max-height:50vh;overflow:auto"></div></dialog>
<dialog id="dMore"><h2>More</h2><div class="list"><button class="ghost" data-go="calendar">Calendar</button><button class="ghost" data-go="goals">Goals</button><button class="ghost" data-go="journal">Journal</button><button class="ghost" data-go="stats">Statistics</button><button class="ghost" data-go="set">Settings</button><button class="ghost" data-cmd>Search commands</button></div><p><button class="ghost" data-close>Close</button></p></dialog>
<dialog id="dHab"><form id="fHab"><h2 id="dHabH">New habit</h2>
<label>Name<input name="title" required maxlength="80"></label>
<label>Category<select name="cat"><option>Education</option><option>Personal development</option><option>Health and wellness</option><option>Spiritual development</option><option>Productivity</option><option>Lifestyle</option></select></label>
<div class="mu" style="font-size:13px;margin-bottom:4px">Repeat on</div><div class="row" style="margin-bottom:12px"><label style="display:flex;gap:4px;align-items:center;margin:0"><input type="checkbox" name="d1" checked>Mon</label><label style="display:flex;gap:4px;align-items:center;margin:0"><input type="checkbox" name="d2" checked>Tue</label><label style="display:flex;gap:4px;align-items:center;margin:0"><input type="checkbox" name="d3" checked>Wed</label><label style="display:flex;gap:4px;align-items:center;margin:0"><input type="checkbox" name="d4" checked>Thu</label><label style="display:flex;gap:4px;align-items:center;margin:0"><input type="checkbox" name="d5" checked>Fri</label><label style="display:flex;gap:4px;align-items:center;margin:0"><input type="checkbox" name="d6" checked>Sat</label><label style="display:flex;gap:4px;align-items:center;margin:0"><input type="checkbox" name="d0" checked>Sun</label></div>
<label>Daily reminder (optional)<input type="time" name="remind"></label>
<div class="row sp"><button type="button" class="ghost" data-close>Cancel</button><button class="btn">Save habit</button></div></form></dialog>
<dialog id="dGoal"><form id="fGoal"><h2 id="dGoalH">New goal</h2>
<label>Title<input name="title" required maxlength="100"></label>
<label>Description (optional)<textarea name="desc" rows="2" maxlength="400"></textarea></label>
<div class="two-f"><label>Type<select name="gtype"><option>Daily</option><option>Weekly</option><option>Monthly</option><option selected>Yearly</option><option>Long-term</option></select></label><label>Target date<input type="date" name="tdate"></label></div>
<label>Category<input name="cat" list="cats" maxlength="30"></label>
<div id="gm"><label>Milestones (one per line)<textarea name="ms" rows="3" maxlength="600"></textarea></label></div>
<div class="row sp"><button type="button" class="ghost" data-close>Cancel</button><button class="btn">Save goal</button></div></form></dialog>
<dialog id="dFocus"><h2 id="fT"></h2><p id="fM" class="mu"></p><div class="row" id="fBtns"></div></dialog>
<dialog id="dAlarm"><h2 id="aT"></h2><p id="aM" class="mu"></p><p id="aN" class="mu" hidden>Your browser is blocking sound. Tap this window to allow it.</p>
<div class="row"><button class="btn" id="aStop" data-astop>STOP ALARM</button><button class="ghost" data-asnz>Snooze 5 min</button><button class="ghost" data-adis>Dismiss</button><button class="ghost" data-aview>View task</button></div></dialog>
<div id="toast" role="status"></div>

<script>
const KEY='mono.v1', $=s=>document.querySelector(s);
const dflt=()=>({tasks:[],acts:[],cats:['Work','Personal','Health','Learning'],name:'',theme:'dark',prefs:{notif:false,sound:false,tone:'chime',vol:.8,defRem:'off',dlNotif:true,asked:false,amb:'off',hide:{}},rlog:{},snz:[],focus:[],habits:[],goals:[],events:[],journal:[],quotes:{off:0,fav:[]},ft:{mode:'focus',dur:1500,left:1500,end:0,tid:'',fd:25}});
let S=dflt(), view='dash', filter='all', tab='tasks', day='', editing=null, loading=true;
const todayISO=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function load(){try{const r=localStorage.getItem(KEY);if(r){S={...dflt(),...JSON.parse(r)};S.prefs={...dflt().prefs,...S.prefs}}}catch(e){toast('Saved data could not be read. Starting fresh.')}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Storage is full or blocked. Changes may not be kept.')}}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2200)}
function ask(title,msg,yes='Confirm'){return new Promise(r=>{const d=$('#dConf');$('#cH').textContent=title;$('#cP').textContent=msg;$('#cYes').textContent=yes;
const done=v=>{d.close();r(v)};$('#cYes').onclick=()=>done(true);$('#cNo').onclick=()=>done(false);d.oncancel=()=>r(false);d.showModal()})}
function applyTheme(){document.documentElement.dataset.theme=S.theme;const m=document.querySelector('meta[name=theme-color]');if(m)m.content=S.theme==='light'?'#F5F1E7':'#101010'}
const fmtD=d=>d?new Date(d+'T00:00').toLocaleDateString(undefined,{day:'numeric',month:'short'}):'';
const fmtT=t=>{const[h,m]=t.split(':');return new Date(0,0,0,h,m).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})};
const nowT=()=>{const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};

function taskHTML(t,compact){
const late=!t.done&&t.due&&t.due<todayISO();
return `<li class="item ${t.done?'done':''}"><button class="chk" data-tog="${t.id}" aria-label="${t.done?'Mark as pending':'Mark as completed'}: ${esc(t.title)}">${t.done?'✓':''}</button>
<div class="grow"><div class="t">${esc(t.title)}</div>${t.desc&&!compact?`<div class="mu">${esc(t.desc)}</div>`:''}
<div class="meta"><span class="pri ${t.pri}">${t.pri}</span>${t.cat?`<span>${esc(t.cat)}</span>`:''}${t.due?`<span class="${late?'late':''}">${late?'Overdue · ':'Due '}${fmtD(t.due)}${t.dueT?' '+fmtT(t.dueT):''}</span>`:''}${t.rem&&t.rem.on&&!t.done?'<span>Reminder on</span>':''}</div></div>
${compact?'':`<button class="lnk" data-edit="${t.id}">Edit</button><button class="lnk" data-del="${t.id}">Delete</button>`}</li>`}

function dash(){

const date=new Date().toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'});

const up=[...pend.filter(t=>t.due).map(t=>({k:t.due+'T'+'99',h:taskHTML(t,1)})),
...S.acts.filter(a=>!a.done&&(a.date>td||(a.date===td&&a.end>=n))).map(a=>({k:a.date+'T'+a.start,h:actHTML(a,1)}))].sort((a,b)=>a.k<b.k?-1:1).slice(0,5);
const rec=[...done].sort((a,b)=>(b.doneAt||0)-(a.doneAt||0)).slice(0,4);
const C=2*Math.PI*72;
return `<div class="view"><h1>${g}${S.name?', '+esc(S.name):''}</h1><div class="mu">${date}</div>
<div class="grid hero card"><div class="ring"><svg width="170" height="170" viewBox="0 0 170 170"><circle class="bg" cx="85" cy="85" r="72"/><circle class="fg" id="fg" cx="85" cy="85" r="72" stroke-dasharray="${C}" stroke-dashoffset="${C}" data-off="${C*(1-pct/100)}"/></svg><span>${pct}%</span></div>
<div><h2>${!T.length?'Your day is a blank page':pct===100?'Everything is done':'Today’s progress'}</h2><p class="mu">${!T.length?'Add your first task to start tracking progress.':`${done.length} of ${T.length} tasks completed.`}</p><button class="btn" data-new>Add task</button></div></div>
<div class="grid stats"><div class="card stat"><b>${T.length}</b><span class="mu">Total tasks</span></div><div class="card stat"><b>${done.length}</b><span class="mu">Completed</span></div><div class="card stat"><b>${pend.length}</b><span class="mu">Pending</span></div></div>
${vis('quote')?quoteCard():''}${vis('today')?`<div class="grid stats" style="margin-top:16px"><div class="card stat"><b>${focusToday()}</b><span class="mu">Focus minutes today</span></div><div class="card stat"><b>${habitsDone()}</b><span class="mu">Habits done today</span></div><div class="card stat"><b>${S.goals.filter(g=>!g.done).length}</b><span class="mu">Active goals</span></div></div>`:''}
<div class="row" style="margin-top:16px"><button class="ghost" data-new>Add task</button><button class="ghost" data-go="focus">Start focus session</button><button class="ghost" data-hnew>Add habit</button><button class="ghost" data-gnew>Create goal</button></div>
${vis('reminders')?`<div class="card" style="margin-top:16px"><h2>Upcoming reminders</h2>${remList(3)}</div>`:''}
${vis('upcoming')?`<div class="grid two" style="margin-top:16px"><div class="card"><h2>Upcoming</h2>${up.length?`<ul class="list">${up.map(u=>u.h).join('')}</ul>`:'<div class="empty">Nothing scheduled. Add a deadline or plan your day.</div>'}</div>
<div class="card"><h2>Recently completed</h2>${rec.length?`<ul class="list">${rec.map(t=>taskHTML(t,1)).join('')}</ul>`:'<div class="empty">Completed tasks will appear here.</div>'}</div></div>`:''}</div>`}

function actHTML(a,compact){

<div class="grow"><div class="t">${esc(a.title)}</div><div class="meta"><span>${fmtT(a.start)} – ${fmtT(a.end)}</span>${compact?`<span>${fmtD(a.date)}</span>`:''}</div></div>
${compact?'':`<button class="lnk" data-aedit="${a.id}">Edit</button><button class="lnk" data-adel="${a.id}">Delete</button>`}</li>`}

addEventListener('offline',()=>toast('You’re offline. Changes are saved on this device.'));addEventListener('online',()=>toast('Back online'));
const KL={p:'Before deadline',d:'At deadline',x:'Exact time',s:'Snoozed',h:'Habit',e:'Event'},ST={fired:'Sent',missed:'Missed',dismissed:'Dismissed',past:'Time had passed'};
const fmtDT=ms=>new Date(ms).toLocaleString([],{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
const dueMs=t=>t.due&&t.dueT?new Date(t.due+'T'+t.dueT).getTime():t.date&&t.start?new Date(t.date+'T'+t.start).getTime():null;
function computeR(){const out=[];
for(const t of S.tasks){if(t.done||!t.rem||!t.rem.on)continue;const dm=dueMs(t);
if(t.rem.k==='exact'){const a=new Date(t.rem.at).getTime();if(a)out.push({key:`${t.id}|x|${a}`,tid:t.id,at:a,kind:'x'})}
else if(dm&&t.rem.min){const a=dm-t.rem.min*6e4;out.push({key:`${t.id}|p|${a}`,tid:t.id,at:a,kind:'p'})}
if(t.rem.dl&&S.prefs.dlNotif&&dm)out.push({key:`${t.id}|d|${dm}`,tid:t.id,at:dm,kind:'d'})}
const td=todayISO();for(const h of S.habits){if(!h.remind||!sched(h,td)||h.log[td])continue;const a=new Date(td+'T'+h.remind).getTime();out.push({key:`${h.id}|h|${a}`,tid:h.id,at:a,kind:'h'})}
for(const e of S.events){if(e.rm===''||e.rm==null)continue;const a=new Date(e.date+'T'+e.start).getTime()-e.rm*6e4;out.push({key:`${e.id}|e|${a}`,tid:e.id,at:a,kind:'e'})}
for(const s of S.snz){const it=itemOf(s.tid);if(it&&!isDone(it))out.push({key:s.key,tid:s.tid,at:s.at,kind:'s'})}
return out}
const upcomingR=()=>computeR().filter(x=>!S.rlog[x.key]&&x.at>Date.now()).sort((a,b)=>a.at-b.at);
function logR(q,st){const t=itemOf(q.tid);S.rlog[q.key]={st,at:q.at,kind:q.kind,tid:q.tid,title:t?t.title:''}}
